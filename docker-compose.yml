services:
  postgres:
    image: postgis/postgis:16-3.5
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: shamal
      POSTGRES_PASSWORD: shamal_local_dev
      POSTGRES_DB: shamal
    volumes:
      - shamal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamal -d shamal"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  shamal_pg:
